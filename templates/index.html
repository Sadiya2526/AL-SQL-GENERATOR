<!DOCTYPE html>
<html>
<head>
    <title>AI SQL Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { padding: 8px; font-size: 16px; }
        button { padding: 8px 15px; font-size: 16px; cursor: pointer; }
        .results { margin-top: 20px; padding: 10px; background-color: #f5f5f5; }
    </style>
</head>
<body>

<h1>AI SQL Query Generator</h1>

<form method="POST">
    <input type="text" name="question" placeholder="Ask Question" required>
    <button type="submit">Generate</button>
</form>

<h3>Generated SQL Query:</h3>
<p><code>{{ sql_query if sql_query else '(No query generated)' }}</code></p>

<h3>Results:</h3>
<div class="results">
{% if result %}
    {% for row in result %}
    <p>{{ row }}</p>
    {% endfor %}
{% else %}
    <p>(No results)</p>
{% endif %}
</div>

</body>
</html>
